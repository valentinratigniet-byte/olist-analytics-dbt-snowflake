version: 2

models:
  - name: fct_orders
    description: "Table de fait des commandes — une ligne par commande"
    columns:
      - name: customer_unique_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_customers')
                field: customer_unique_id
      - name: max_review_score
        tests:
          - accepted_values:
              arguments:
                values: [1, 2, 3, 4, 5]
              config:
                where: "max_review_score is not null"

  - name: dim_customers
    columns:
      - name: customer_unique_id
        tests: [unique, not_null]
      - name: customer_segment
        tests:
          - accepted_values:
              arguments:
                values: ['loyal', 'repeat', 'one_time']
