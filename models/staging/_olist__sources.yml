version: 2

sources:
  - name: olist_raw
    description: "Données brutes"
    database: OLIST
    schema: RAW
    tables:
      - name: olist_orders
        columns:
          - name: order_id
            tests: [unique, not_null]
          - name: customer_id
            tests: [not_null]
      - name: olist_order_items
        columns:
          - name: order_id
            tests: [not_null]
          - name: product_id
            tests: [not_null]
      - name: olist_order_payments
      - name: olist_order_reviews
      - name: olist_customers
        columns:
          - name: customer_id
            tests: [unique, not_null]
      - name: olist_products
        columns:
          - name: product_id
            tests: [unique, not_null]
      - name: olist_sellers
        columns:
          - name: seller_id
            tests: [unique, not_null]
      - name: olist_geolocation
