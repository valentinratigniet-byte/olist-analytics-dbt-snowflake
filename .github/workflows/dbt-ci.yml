name: dbt CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  dbt-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dbt
        run: pip install dbt-snowflake

      # Le compte Snowflake d'essai impose la MFA (TOTP) et n'est pas permanent :
      # la CI valide le projet sans connexion (parse = Jinja, refs, sources, tests,
      # graphe). L'exécution réelle (25/25 tests PASS) est documentée dans le README.
      - name: Profil factice (aucune connexion n'est ouverte)
        run: |
          mkdir -p ~/.dbt
          cat > ~/.dbt/profiles.yml <<EOF
          olist_analytics:
            target: ci
            outputs:
              ci:
                type: snowflake
                account: ci-placeholder
                user: ci
                password: ci
                role: ci
                database: OLIST
                warehouse: ci
                schema: ci
                threads: 1
          EOF

      - name: dbt deps
        run: dbt deps

      - name: dbt parse (compilation du graphe complet)
        run: dbt parse
